name: Test and publish image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish main or the selected release tag after testing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan image checks and publication
        id: plan
        run: python3 scripts/ci.py plan
        env:
          PUBLISH: ${{ inputs.publish || false }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: make check

  image:
    needs: test
    if: needs.test.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore image built for this commit and architecture
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci-images/${{ matrix.arch }}.tar
          key: oci-v1-${{ runner.os }}-${{ matrix.arch }}-${{ github.sha }}
      - name: Build runtime image
        if: steps.cache.outputs.cache-hit != 'true'
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: localhost/submerge
          tags: ci-${{ matrix.arch }}
          containerfiles: ./Containerfile
          oci: true
          squash: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Load cached image
        if: steps.cache.outputs.cache-hit == 'true'
        run: podman load -i ".ci-images/${ARCH}.tar"
        env:
          ARCH: ${{ matrix.arch }}
      - name: Verify image identity
        run: |
          test "$(podman image inspect "$IMAGE" --format '{{.Architecture}}')" = "$ARCH"
          test "$(podman image inspect "$IMAGE" --format '{{index .Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: localhost/submerge:ci-${{ matrix.arch }}
      - name: Test runtime image with local upstreams and nginx
        run: make test-image
        env:
          IMAGE: localhost/submerge:ci-${{ matrix.arch }}
      - name: Save tested OCI image
        if: steps.cache.outputs.cache-hit != 'true' && needs.test.outputs.publish == 'true'
        run: |
          mkdir -p .ci-images
          podman save --format oci-archive -o ".ci-images/${ARCH}.tar" "localhost/submerge:ci-${ARCH}"
        env:
          ARCH: ${{ matrix.arch }}
      - name: Cache tested image for release runs
        if: steps.cache.outputs.cache-hit != 'true' && needs.test.outputs.publish == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-images/${{ matrix.arch }}.tar
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload tested OCI image
        if: needs.test.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-${{ matrix.arch }}
          path: .ci-images/${{ matrix.arch }}.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [test, image]
    if: needs.test.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    # Serialize every publication, including different release tags and manual runs.
    concurrency:
      group: ghcr-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: image-*
          path: .ci-images
          merge-multiple: true
      - name: Select tags against current remote refs
        id: release
        run: python3 scripts/ci.py tags
      - name: Assemble manifest from tested images
        run: |
          for arch in amd64 arm64; do
            podman load -i ".ci-images/${arch}.tar"
          done
          podman manifest create localhost/submerge:publish \
            containers-storage:localhost/submerge:ci-amd64 \
            containers-storage:localhost/submerge:ci-arm64
          for tag in $TAGS; do
            podman tag localhost/submerge:publish "localhost/${IMAGE_NAME}:${tag}"
          done
        env:
          TAGS: ${{ steps.release.outputs.tags }}
          IMAGE_NAME: ${{ steps.release.outputs.name }}
      - name: Log in to GHCR
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested manifest
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.release.outputs.name }}
          tags: ${{ steps.release.outputs.tags }}
          registry: ghcr.io/${{ steps.release.outputs.owner }}
      - name: Record publication
        run: |
          {
            echo 'Published linux/amd64 and linux/arm64 after native HTTP/nginx tests.'
            echo
            echo "Image: ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "Tags: ${TAGS}"
            echo "Digest: ${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAGS: ${{ steps.release.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
