[project]
name = "submerge"
version = "0.0.0"
description = "HTTP subscription merger"
requires-python = ">=3.12"
dependencies = ["qrcode==8.2"]

[dependency-groups]
dev = ["ruff==0.16.8"]

[tool.uv]
package = false
required-version = ">=0.11.29"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
