<!doctype html><html><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>$TITLE • $SID</title>
<style>
:root{--bg:#0b0f17;--c:rgba(255,255,255,.06);--t:rgba(255,255,255,.92);--m:rgba(255,255,255,.62);--s:rgba(255,255,255,.10)}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);overflow-x:hidden}
body{margin:0;min-height:100vh;min-height:100dvh;overflow-x:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
background:radial-gradient(1200px 600px at 20% -10%, rgba(100,160,255,.18), transparent 50%),var(--bg);color:var(--t)}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 44px}
.top{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:880px){.top{grid-template-columns:1fr 320px}}
h1{margin:0 0 6px;font-size:18px}
.sub{color:var(--m);font-size:13px}
.chips{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--s);background:rgba(255,255,255,.03);padding:8px 10px;border-radius:999px;color:var(--m);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--s);background:var(--c);color:var(--t);padding:10px 12px;border-radius:12px;cursor:pointer;font-size:13px}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.primary{background:rgba(60,180,220,.18);border-color:rgba(90,220,255,.32)}
.panel{margin-top:14px;border:1px solid var(--s);border-radius:16px;overflow:hidden;background:rgba(255,255,255,.03)}
.hd{padding:12px 14px;border-bottom:1px solid var(--s);display:flex;justify-content:space-between;color:var(--m);font-size:13px}
.bd{padding:10px;max-height:64vh;overflow:auto}
.clientbd{padding:12px;display:grid;gap:12px}
.platforms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:720px){.platforms{grid-template-columns:repeat(6,minmax(0,1fr))}}
.platform{border:1px solid var(--s);background:rgba(255,255,255,.025);color:var(--m);padding:9px 8px;border-radius:14px;cursor:pointer;font-size:12px;display:flex;gap:7px;align-items:center;justify-content:center;min-height:40px}
.platform svg{width:17px;height:17px;flex:0 0 auto}
.platform.active{background:rgba(90,220,255,.14);border-color:rgba(90,220,255,.36);color:var(--t);box-shadow:inset 0 0 0 1px rgba(90,220,255,.08)}
.recommended{border:1px solid rgba(90,220,255,.28);background:linear-gradient(135deg,rgba(34,211,238,.13),rgba(255,255,255,.025));border-radius:18px;padding:14px;display:grid;gap:12px}
.clientgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:720px){.clientgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.client{border:1px solid var(--s);background:rgba(255,255,255,.025);border-radius:16px;padding:12px;display:grid;gap:10px}
.clienthead{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;min-width:0}
.clientname{font-weight:650;font-size:14px;line-height:1.2}
.clientmeta{color:var(--m);font-size:12px;line-height:1.35;margin-top:3px}
.appicon{width:42px;height:42px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:rgba(255,255,255,.9);font-weight:800;font-size:15px;letter-spacing:.02em;box-shadow:inset 0 0 20px rgba(255,255,255,.03);overflow:hidden;padding:2px}
.appicon svg{width:24px;height:24px}
.appicon img{width:100%;height:100%;object-fit:contain;display:block;border-radius:8px}
.appicon-happ{background:linear-gradient(135deg,rgba(34,211,238,.26),rgba(255,255,255,.05))}
.appicon-mihomo{background:linear-gradient(135deg,rgba(99,102,241,.26),rgba(255,255,255,.05))}
.appicon-raw{background:linear-gradient(135deg,rgba(32,201,151,.20),rgba(255,255,255,.05))}
.clientactions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:stretch}
.clientactions .btn{width:100%;min-width:0;min-height:40px;padding:9px 10px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;white-space:normal;overflow-wrap:anywhere}
.clientactions .client-action-primary{grid-column:1/-1}
@media(max-width:420px){.clientactions{grid-template-columns:1fr}}
.sectionTitle{color:var(--m);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.routebox{border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(0,0,0,.10);overflow:hidden}
.routebox summary{border:0;padding:9px 10px;font-size:12px;color:var(--m)}
.routebox .clientactions{padding:0 10px 10px}
.routehint{margin:0;padding:0 10px 10px;color:var(--m);font-size:12px;line-height:1.35}
.empty{color:var(--m);font-size:13px;padding:4px 2px}
.row{width:100%;text-align:left;border:1px solid var(--s);background:rgba(255,255,255,.03);color:var(--t);padding:10px;border-radius:14px;cursor:pointer;display:grid;gap:8px;margin-bottom:10px}
.row:hover{background:rgba(255,255,255,.06)}
.name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr{border:1px solid var(--s);border-radius:16px;background:rgba(255,255,255,.03);padding:14px;display:grid;justify-items:center;gap:10px}
.qr img{width:220px;height:220px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.06)}
.lang{border:1px solid var(--s);background:rgba(255,255,255,.03);color:var(--t);padding:8px 10px;border-radius:12px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(15,20,30,.92);border:1px solid rgba(255,255,255,.16);
padding:10px 12px;border-radius:14px;font-size:13px;opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-2px)}
pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:rgba(255,255,255,.88)}
details{margin-top:14px;border:1px solid var(--s);border-radius:16px;background:rgba(255,255,255,.03);overflow:hidden}
summary{cursor:pointer;padding:12px 14px;color:var(--m);font-size:13px;border-bottom:1px solid var(--s);list-style:none}
summary::-webkit-details-marker{display:none}
.note{border:1px solid var(--s);background:rgba(255,210,120,.18);border-radius:14px;padding:10px 12px;margin:10px 0 0;font-size:13px}
</style></head><body>
<div class="wrap">
  <div class="top">
    <div>
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center">
        <div>
          <h1 id="t">$TITLE</h1>
          <div class="sub">ID: <span style="font-family:ui-monospace,Menlo,Consolas">$SID</span></div>
        </div>
        <div><select class="lang" id="langSel">$LANG_OPTIONS</select></div>
      </div>

      <div class="chips">
        <div class="chip" id="chipRemaining"></div>
        <div class="chip" id="chipLinks"></div>
      </div>

      <div class="actions">
        <button class="btn" type="button" id="copySub"></button>
        <button class="btn" type="button" id="copyAll"></button>
      </div>

      $NOTE
    </div>

    <div class="qr">
      $QR
      <div class="sub" style="text-align:center">
        <div id="scan"></div>
        <div style="margin-top:6px;font-family:ui-monospace,Menlo,Consolas;font-size:12px;word-break:break-all">$SUBURL</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="hd"><div id="clientsLbl"></div><div id="clientPlatformLbl"></div></div>
    <div class="clientbd">
      <div class="platforms" id="platformTabs"></div>
      <div id="recommendedClient"></div>
      <div class="sectionTitle" id="otherClientsLbl"></div>
      <div class="clientgrid" id="clientGrid"></div>
    </div>
  </div>

  <div class="panel">
    <div class="hd"><div id="listLbl"></div><div id="hint"></div></div>
    <div class="bd" id="list">$ITEMS</div>
  </div>

  <details>
    <summary id="detailsLbl"></summary>
    <pre id="userinfo">$USERINFO</pre>
    <pre id="raw">$RAW</pre>
    <div class="actions" style="padding:0 14px 14px"><button class="btn" type="button" id="copyRaw"></button></div>
  </details>
</div>

<div class="toast" id="toast"></div>

<script>
const SUB_URL = $SUBURL_JS;
const LINKS = $LINKS;
const UI = { kind:$KIND, total:$TOTAL, used:$USED, remain:$REMAIN };
const I18N = $I18N_JSON;
const APP = $CLIENTS_CONFIG;
const LANGS = Object.keys(I18N);
const FALLBACK_LANG = LANGS[0] || "";
const PLATFORMS = [
  { id:"ios", label:"iOS", icon:"apple" },
  { id:"android", label:"Android", icon:"android" },
  { id:"windows", label:"Windows", icon:"windows" },
  { id:"macos", label:"macOS", icon:"apple" },
  { id:"linux", label:"Linux", icon:"linux" },
  { id:"androidTV", label:"TV", icon:"android" }
];
const RECOMMENDED = {
  ios:"Happ",
  android:"Happ",
  windows:"Happ",
  macos:"Happ",
  linux:"Koala Clash",
  androidTV:"Happ"
};
const DOWNLOADS = {
  happIos:"https://apps.apple.com/us/app/happ-proxy-utility/id6504287215",
  happAndroid:"https://play.google.com/store/apps/details?id=com.happproxy",
  happDesktop:"https://github.com/Happ-proxy/happ-desktop/releases",
  v2Ios:"https://apps.apple.com/us/app/v2raytun/id6476628951",
  v2Android:"https://play.google.com/store/apps/details?id=com.v2raytun.android",
  shadowrocket:"https://apps.apple.com/us/app/shadowrocket/id932747118",
  streisand:"https://apps.apple.com/us/app/streisand/id6450534064",
  koala:"https://github.com/coolcoala/koala-clash/releases",
  flclash:"https://github.com/chen08209/FlClash/releases",
  throne:"https://github.com/throneproj/Throne/releases"
};
const CLIENTS = {
  ios: [
    { name:"Happ", icon:"happ", kind:"raw", desc:"clientDescHapp", open:()=>`happ://add/${APP.urls.happ}`, download:DOWNLOADS.happIos, route:"happ" },
    { name:"V2RayTun", icon:"v2", kind:"raw", desc:"clientDescRoute", open:()=>`v2raytun://import/${APP.urls.v2raytun}`, download:DOWNLOADS.v2Ios, route:"v2raytun" },
    { name:"Shadowrocket", icon:"sr", kind:"raw", desc:"clientDescRaw", open:()=>`shadowrocket://add/${APP.urls.base64}#${encodeURIComponent(APP.subId||"sub")}`, download:DOWNLOADS.shadowrocket },
    { name:"Streisand", icon:"st", kind:"raw", desc:"clientDescRaw", open:()=>`streisand://import/${APP.urls.base64}`, download:DOWNLOADS.streisand }
  ],
  android: [
    { name:"Happ", icon:"happ", kind:"raw", desc:"clientDescHapp", open:()=>`happ://add/${APP.urls.happ}`, download:DOWNLOADS.happAndroid, route:"happ" },
    { name:"V2RayTun", icon:"v2", kind:"raw", desc:"clientDescRoute", open:()=>`v2raytun://import/${APP.urls.v2raytun}`, download:DOWNLOADS.v2Android, route:"v2raytun" }
  ],
  windows: [
    { name:"Happ", icon:"happ", kind:"raw", desc:"clientDescHapp", open:()=>`happ://add/${APP.urls.happ}`, download:DOWNLOADS.happDesktop, route:"happ" },
    { name:"Koala Clash", icon:"koala", kind:"mihomo", desc:"clientDescMihomo", open:()=>`koala-clash://install-config?url=${encodeURIComponent(APP.urls.mihomo)}`, download:DOWNLOADS.koala },
    { name:"Throne", icon:"th", kind:"raw", desc:"clientDescManual", copy:()=>APP.urls.base64, download:DOWNLOADS.throne }
  ],
  macos: [
    { name:"Happ", icon:"happ", kind:"raw", desc:"clientDescHapp", open:()=>`happ://add/${APP.urls.happ}`, download:DOWNLOADS.happDesktop, route:"happ" },
    { name:"V2RayTun", icon:"v2", kind:"raw", desc:"clientDescRoute", open:()=>`v2raytun://import/${APP.urls.v2raytun}`, download:DOWNLOADS.v2Ios, route:"v2raytun" },
    { name:"Koala Clash", icon:"koala", kind:"mihomo", desc:"clientDescMihomo", open:()=>`koala-clash://install-config?url=${encodeURIComponent(APP.urls.mihomo)}`, download:DOWNLOADS.koala },
    { name:"Throne", icon:"th", kind:"raw", desc:"clientDescManual", copy:()=>APP.urls.base64, download:DOWNLOADS.throne }
  ],
  linux: [
    { name:"Happ", icon:"happ", kind:"raw", desc:"clientDescHapp", open:()=>`happ://add/${APP.urls.happ}`, download:DOWNLOADS.happDesktop, route:"happ" },
    { name:"Koala Clash", icon:"koala", kind:"mihomo", desc:"clientDescMihomo", open:()=>`koala-clash://install-config?url=${encodeURIComponent(APP.urls.mihomo)}`, download:DOWNLOADS.koala },
    { name:"FlClashX", icon:"fl", kind:"mihomo", desc:"clientDescMihomo", open:()=>`flclashx://install-config?url=${encodeURIComponent(APP.urls.mihomo)}`, download:DOWNLOADS.flclash },
    { name:"Throne", icon:"th", kind:"raw", desc:"clientDescManual", copy:()=>APP.urls.base64, download:DOWNLOADS.throne }
  ],
  androidTV: [
    { name:"Happ", icon:"happ", kind:"raw", desc:"clientDescHapp", open:()=>`happ://add/${APP.urls.happ}`, download:DOWNLOADS.happAndroid, route:"happ" }
  ]
};

function gb(b){ return (b/1000000000).toFixed(2); }
function fmt(template, vars){
  let out=String(template||"");
  Object.entries(vars||{}).forEach(([k,v])=>{
    out=out.replaceAll("{"+k+"}", String(v));
  });
  return out;
}
function strings(lang){
  return I18N[lang] || I18N[FALLBACK_LANG] || {};
}
function tx(t, key){
  return t[key] || "";
}
function remText(lang){
  const t=strings(lang);
  if (!UI) return tx(t, "no");
  if (UI.kind==="unlimited") return tx(t, "unlim");
  if (UI.kind!=="limited" && UI.kind!=="limited_partial") return tx(t, "no");
  return fmt(tx(t, "lim"), {remain:gb(UI.remain||0), total:gb(UI.total||0), used:gb(UI.used||0)});
}
const byId = (id) => document.getElementById(id);
const titleEl = byId("t");
const scanEl = byId("scan");
const listLblEl = byId("listLbl");
const hintEl = byId("hint");
const detailsLblEl = byId("detailsLbl");
const copySubEl = byId("copySub");
const copyAllEl = byId("copyAll");
const copyRawEl = byId("copyRaw");
const chipLinksEl = byId("chipLinks");
const chipRemainingEl = byId("chipRemaining");
const clientsLblEl = byId("clientsLbl");
const clientPlatformLblEl = byId("clientPlatformLbl");
const platformTabsEl = byId("platformTabs");
const recommendedClientEl = byId("recommendedClient");
const otherClientsLblEl = byId("otherClientsLbl");
const clientGridEl = byId("clientGrid");
const rawEl = byId("raw");
const langSel = byId("langSel");
let currentPlatform = detectPlatform();

function apply(lang){
  const t=strings(lang);
  document.documentElement.lang=lang || FALLBACK_LANG;
  if (titleEl) titleEl.textContent=tx(t, "title");
  if (scanEl) scanEl.textContent=tx(t, "scan");
  if (listLblEl) listLblEl.textContent=tx(t, "list");
  if (hintEl) hintEl.textContent=tx(t, "hint");
  if (detailsLblEl) detailsLblEl.textContent=tx(t, "details");
  if (copySubEl) copySubEl.textContent=tx(t, "copyUrl");
  if (copyAllEl) copyAllEl.textContent=tx(t, "copyAll");
  if (copyRawEl) copyRawEl.textContent=tx(t, "copyRaw");
  if (chipLinksEl) chipLinksEl.textContent=fmt(tx(t, "links"), {n: LINKS});
  if (chipRemainingEl) chipRemainingEl.textContent=remText(lang);
  if (clientsLblEl) clientsLblEl.textContent=tx(t, "clients");
  if (otherClientsLblEl) otherClientsLblEl.textContent=tx(t, "clientOther");
  renderClientLauncher(lang);
}
function toast(msg){
  const t=byId("toast");
  if (!t) return;
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1200);
}
async function copyText(text){
  try{
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.left="-9999px";
       document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand("copy"); document.body.removeChild(ta); return ok; }catch(_){ return false; }
}
function browserLang(){
  const requested=[];
  if (Array.isArray(navigator.languages)) requested.push(...navigator.languages);
  if (navigator.language) requested.push(navigator.language);
  for (const raw of requested) {
    const lang=String(raw||"").toLowerCase();
    const exact=LANGS.find((x)=>x.toLowerCase()===lang);
    if (exact) return exact;
    const primary=lang.split("-")[0];
    const primaryMatch=LANGS.find((x)=>x.toLowerCase()===primary);
    if (primaryMatch) return primaryMatch;
  }
  return FALLBACK_LANG;
}
function detectPlatform(){
  const ua=String(navigator.userAgent||"").toLowerCase();
  if (/iphone|ipad|ipod/.test(ua)) return "ios";
  if (/android/.test(ua) && /tv|aft|smart-tv|googletv/.test(ua)) return "androidTV";
  if (/android/.test(ua)) return "android";
  if (/windows/.test(ua)) return "windows";
  if (/macintosh|mac os/.test(ua)) return "macos";
  if (/linux|x11/.test(ua)) return "linux";
  return "windows";
}
function platformLabel(id){
  const item=PLATFORMS.find((p)=>p.id===id);
  return item ? item.label : id;
}
function iconSvg(name){
  const icons={
    apple:'<svg viewBox="0 0 24 24" fill="none"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04c-2.04.027-3.91 1.183-4.961 3.014c-2.117 3.675-.546 9.103 1.519 12.09c1.013 1.454 2.208 3.09 3.792 3.039c1.52-.065 2.09-.987 3.935-.987c1.831 0 2.35.987 3.96.948c1.637-.026 2.676-1.48 3.676-2.948c1.156-1.688 1.636-3.325 1.662-3.415c-.039-.013-3.182-1.221-3.22-4.857c-.026-3.04 2.48-4.494 2.597-4.559c-1.429-2.09-3.623-2.324-4.39-2.376c-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83c-1.207.052-2.662.805-3.532 1.818c-.78.896-1.454 2.338-1.273 3.714c1.338.104 2.715-.688 3.559-1.701"/></svg>',

function appIcon(client){
  const cls=client.kind==="mihomo" ? "appicon-mihomo" : client.icon==="happ" ? "appicon-happ" : "appicon-raw";
  const url=APP_ICON_URLS[client.icon];
  if (url) return `<span class="appicon ${cls}"><img src="${escapeAttr(url)}" alt="" loading="lazy" referrerpolicy="no-referrer"/></span>`;
  const svg=APP_ICON_SVGS[client.icon] || APP_ICON_SVGS.clash;
  return `<span class="appicon ${cls}">${svg}</span>`;
}
function manualImportUrl(client){
  if (client.copy) return client.copy();
  if (client.kind==="mihomo") return APP.urls.mihomo;
  if (client.route==="happ") return APP.urls.happ;
  if (client.route==="v2raytun") return APP.urls.v2raytun;
  return APP.urls.base64;
}
function openExternal(url){
  if (!url) return;
  window.location.href=url;
}
function recommendedClient(clients){
  const name=RECOMMENDED[currentPlatform];
  return clients.find((client)=>client.name===name) || clients[0] || null;
}
function renderRouteBox(client, t){
  const route=client.route && APP.routing ? APP.routing[client.route] : "";
  if (!route) return "";
  return `<details class="routebox">
    <summary>${tx(t, "clientAdvanced")}</summary>
    <p class="routehint">${tx(t, "clientRouteHint")}</p>
    <div class="clientactions">
      <button class="btn client-action" type="button" data-open="${escapeAttr(route)}">${tx(t, "clientRoute")}</button>
      <button class="btn client-action" type="button" data-copy="${escapeAttr(route)}">${tx(t, "clientRouteCopy")}</button>
    </div>
  </details>`;
}
function renderClientCard(client, t, featured){
  const open=client.open ? client.open() : "";
  const copy=manualImportUrl(client);
  const openBtn=open ? `<button class="btn primary client-action client-action-primary" type="button" data-open="${escapeAttr(open)}">${tx(t, "clientOpen")}</button>` : "";
  const copyBtn=`<button class="btn client-action client-action-secondary" type="button" data-copy="${escapeAttr(copy)}">${tx(t, client.copy ? "clientCopyOnly" : "clientCopy")}</button>`;
  const downloadBtn=client.download ? `<button class="btn client-action client-action-secondary" type="button" data-open="${escapeAttr(client.download)}">${tx(t, "clientDownload")}</button>` : "";
  const intro=featured ? `<div class="sectionTitle">${tx(t, "clientRecommended")}</div>` : "";
  const cls=featured ? "recommended" : "client";
  return `<div class="${cls}">
    ${intro}
    <div class="clienthead">
      ${appIcon(client)}
      <div><div class="clientname">${escapeHtml(client.name)}</div><div class="clientmeta">${tx(t, client.desc || "clientDescRaw")}</div></div>
    </div>
    <div class="clientactions">${openBtn}${copyBtn}${downloadBtn}</div>
    ${renderRouteBox(client,t)}
  </div>`;
}
function renderClientLauncher(lang){
  const t=strings(lang);
  if (clientPlatformLblEl) clientPlatformLblEl.textContent=platformLabel(currentPlatform);
  if (platformTabsEl) {
    platformTabsEl.innerHTML=PLATFORMS.map((p)=>(
      `<button class="platform ${p.id===currentPlatform?"active":""}" type="button" data-platform="${p.id}">${iconSvg(p.icon)}<span>${p.label}</span></button>`
    )).join("");
  }
  if (!clientGridEl || !recommendedClientEl) return;
  const clients=CLIENTS[currentPlatform] || [];
  if (!clients.length) {
    recommendedClientEl.innerHTML="";
    if (otherClientsLblEl) otherClientsLblEl.style.display="none";
    clientGridEl.innerHTML=`<div class="empty">${tx(t, "clientEmpty")}</div>`;
    return;
  }
  const rec=recommendedClient(clients);
  const other=clients.filter((client)=>client!==rec);
  recommendedClientEl.innerHTML=rec ? renderClientCard(rec,t,true) : "";
  if (otherClientsLblEl) otherClientsLblEl.style.display=other.length ? "block" : "none";
  clientGridEl.innerHTML=other.map((client)=>renderClientCard(client,t,false)).join("");
}
function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,(ch)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}
function escapeAttr(value){
  return escapeHtml(value).replace(/`/g,"&#96;");
}
let stored="";
try { stored=(localStorage.getItem("lang")||"").toLowerCase(); } catch(_) {}
const auto=browserLang();
if (langSel) {
  const storedLang=LANGS.find((x)=>x.toLowerCase()===stored);
  langSel.value=storedLang || auto;
  apply(langSel.value);
  langSel.addEventListener("change",()=>{
    try { localStorage.setItem("lang",langSel.value); } catch(_) {}
    apply(langSel.value);
  });
} else {
  apply(auto);
}

document.addEventListener("click", async (e)=>{
  if (!(e.target instanceof Element)) return;
  const platform=e.target.closest("button.platform");
  if (platform) {
    currentPlatform=platform.getAttribute("data-platform") || currentPlatform;
    renderClientLauncher((langSel && langSel.value) || auto);
    return;
  }
  const action=e.target.closest("button.client-action");
  if (action) {
    const lang=(langSel && langSel.value) || auto;
    const t=strings(lang);
    const copy=action.getAttribute("data-copy") || "";
    const open=action.getAttribute("data-open") || "";
    if (copy) {
      const ok=await copyText(copy);
      toast(ok?tx(t, "ok"):tx(t, "fail"));
      return;
    }
    if (open) {
      openExternal(open);
      toast(tx(t, "clientOpening"));
      return;
    }
  }
  const b=e.target.closest("button.row"); if(!b) return;
  const ok=await copyText(b.getAttribute("data-copy")||"");
  const t=strings((langSel && langSel.value) || auto); toast(ok?tx(t, "ok"):tx(t, "fail"));
});
if (copySubEl) copySubEl.addEventListener("click", async ()=>{
  const ok=await copyText(SUB_URL); const t=strings((langSel && langSel.value) || auto); toast(ok?tx(t, "ok"):tx(t, "fail"));
});
if (copyAllEl) copyAllEl.addEventListener("click", async ()=>{
  const items=Array.from(document.querySelectorAll("#list button.row"))
    .map((x)=>x.getAttribute("data-copy")||"")
    .filter(Boolean);
  const ok=items.length>0 ? await copyText(items.join("\n")) : false;
  const t=strings((langSel && langSel.value) || auto); toast(ok?tx(t, "ok"):tx(t, "fail"));
});
if (copyRawEl) copyRawEl.addEventListener("click", async ()=>{
  const ok=await copyText((rawEl && rawEl.textContent)||"");
  const t=strings((langSel && langSel.value) || auto); toast(ok?tx(t, "ok"):tx(t, "fail"));
});
